name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main ]

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: "Debug: Maven Dependency Tree"
      run: ./mvnw -V dependency:tree

    - name: Cache SonarQube packages
      uses: actions/cache@v6
      with:
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Build and analyze
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: ./mvnw -V -B clean verify sonar:sonar

    - name: Codecov Code Coverage
      uses: codecov/codecov-action@v6
      with:
        fail_ci_if_error: true # optional (default = false)
        files: ./target/site/jacoco/jacoco.xml
        flags: unittests # optional
        token: ${{ secrets.CODECOV_TOKEN }}
        verbose: false

    - name: Run Rewrite Dry Run
      run: ./mvnw -V -B rewrite:dryRun -DfailOnDryRunResults=true

    - name: Upload Rewrite Patch
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: rewrite-patch
        path: target/rewrite/rewrite.patch
